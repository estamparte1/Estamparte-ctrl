<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>Estamparte Control</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#191919;background:#f4f4f4}*{box-sizing:border-box}body{margin:0}header{background:#111;color:white;padding:18px;text-align:center;border-bottom:6px solid #ffe500}header img{width:min(100%,360px);max-height:125px;object-fit:contain;background:white;border-radius:5px}header p{font-size:12px;margin:8px}main{max-width:850px;margin:auto;padding:16px}h1{font-size:23px}h2{font-size:19px}section{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}.buttons{display:grid;gap:12px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:14px;cursor:pointer;background:#ffe500;color:#111}.buttons button{font-size:18px;text-align:left}.secondary{background:#eee}.danger{background:#ffe1e1}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}label{display:block;font-size:13px;font-weight:700;margin:10px 0}input,select,textarea{width:100%;font:inherit;border:1px solid #bbb;border-radius:7px;padding:11px;margin-top:5px;background:white}textarea{min-height:70px}.item{border:1px solid #ddd;padding:12px;border-radius:9px;margin:10px 0}.totals{background:#f8f8f8;padding:12px;border-radius:8px}.totals p{display:flex;justify-content:space-between;margin:8px 0}.totals .big{background:#ffe500;padding:10px;font-weight:900}.hidden{display:none}.record{border-bottom:1px solid #ddd;padding:12px 0}.record button{font-size:13px;padding:8px;margin:4px}.hint{font-size:12px;color:#666}footer{text-align:center;font-size:11px;padding:20px}.status{font-size:13px;color:#245a26}#screen{min-height:200px}
</style></head><body><header><img src="logo.png" alt="Logo Estamparte"><p>Imperio de Bizancio 1004, Juventud 2000 · Mexicali, B.C.</p><p>WhatsApp 686 406 1365</p></header><main><div id="home"><h1>ESTAMPARTE CONTROL</h1><div class="buttons"><button onclick="show('consult')">🔎 Consultar clientes y documentos</button><button onclick="newDoc('cotizacion')">📄 Nueva cotización</button><button onclick="newDoc('recibo')">🧾 Nuevo recibo de pago</button><button class="secondary" onclick="show('backup')">💾 Respaldar / restaurar datos</button></div></div><div id="screen" class="hidden"></div></main><footer>ESTAMparte · Control de documentos · Los datos se guardan en este dispositivo</footer><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,docType='recibo',items=[],currentId=null;const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const request=indexedDB.open('estamparte-control-v1',1);request.onupgradeneeded=e=>{let d=e.target.result;d.createObjectStore('clients',{keyPath:'id'});d.createObjectStore('documents',{keyPath:'id'})};request.onsuccess=e=>{db=e.target.result};request.onerror=()=>alert('No se pudo abrir la base de datos de este navegador.');function all(store){return new Promise((resolve,reject)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(store,value){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(value);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function del(store,id){return new Promise((resolve,reject)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function home(){ $('#home').classList.remove('hidden');$('#screen').classList.add('hidden')}function show(kind){$('#home').classList.add('hidden');$('#screen').classList.remove('hidden');if(kind==='consult')consult();else if(kind==='backup')backup()}
function newDoc(type,data=null){docType=type;currentId=data?.id||null;items=data?.items?.map(x=>({...x}))||[{description:'',quantity:1,price:0}];$('#home').classList.add('hidden');$('#screen').classList.remove('hidden');$('#screen').innerHTML=`<button class="secondary" onclick="home()">← Inicio</button><h1>${type==='recibo'?'Nuevo recibo de pago':'Nueva cotización'}</h1><section><h2>Cliente</h2><label>Buscar cliente existente<select id="existing"><option value="">Nuevo cliente</option></select></label><label>Nombre o razón social<input id="name" required value="${esc(data?.client?.name)}"></label><div class="row"><label>Teléfono<input id="phone" type="tel" value="${esc(data?.client?.phone)}"></label><label>Correo (opcional)<input id="email" type="email" value="${esc(data?.client?.email)}"></label></div><label>Fecha<input id="date" type="date" value="${data?.date||today()}"></label></section><section><h2>Artículos</h2><div id="items"></div><button onclick="addItem()">+ Agregar artículo</button><div class="row"><label>IVA<select id="tax"><option value="0">Sin IVA</option><option value="0.08">IVA 8%</option><option value="0.16">IVA 16%</option></select></label>${type==='recibo'?`<label>Anticipo recibido<input id="advance" type="number" min="0" step="0.01" value="${data?.advance||0}"></label>`:''}</div><label>Observaciones<textarea id="notes">${esc(data?.notes)}</textarea></label><div id="totals" class="totals"></div></section><section><div class="buttons"><button onclick="saveDoc()">💾 Guardar ${type==='recibo'?'recibo':'cotización'}</button><button class="secondary" onclick="exportCurrent()">📄 Generar PDF</button></div><p class="hint">Primero guarda el documento para que aparezca en Consultar. El PDF se puede compartir desde Archivos del iPhone.</p><p id="msg" class="status"></p></section>`;$('#tax').value=String(data?.tax||0);$('#tax').onchange=calc;if($('#advance'))$('#advance').oninput=calc;renderItems();loadClients(data?.client?.id)}
async function loadClients(id){let list=await all('clients'),sel=$('#existing');list.sort((a,b)=>a.name.localeCompare(b.name));list.forEach(c=>sel.add(new Option(`${c.name} · ${c.phone||'sin teléfono'}`,c.id)));sel.value=id||'';sel.onchange=()=>{let c=list.find(x=>x.id===sel.value);if(c){$('#name').value=c.name;$('#phone').value=c.phone||'';$('#email').value=c.email||''}}}
function addItem(){items.push({description:'',quantity:1,price:0});renderItems()}function syncItems(){document.querySelectorAll('.item').forEach((e,i)=>{items[i]={description:e.querySelector('.desc').value,quantity:Number(e.querySelector('.qty').value),price:Number(e.querySelector('.price').value)}})}function renderItems(){let holder=$('#items');holder.innerHTML=items.map((x,i)=>`<div class="item"><strong>Artículo ${i+1}</strong><label>Descripción<input class="desc" value="${esc(x.description)}"></label><div class="row"><label>Cantidad<input class="qty" type="number" min="1" step="1" value="${x.quantity}"></label><label>Precio unitario<input class="price" type="number" min="0" step="0.01" value="${x.price}"></label></div><div>Importe: <b class="amount">${money(x.quantity*x.price)}</b></div><button class="secondary" onclick="removeItem(${i})">Quitar artículo</button></div>`).join('');holder.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{syncItems();calc()}));calc()}function removeItem(i){syncItems();if(items.length===1)return alert('Debe quedar al menos un artículo');items.splice(i,1);renderItems()}function values(){syncItems();let subtotal=items.reduce((s,x)=>s+x.quantity*x.price,0),tax=Number($('#tax').value),iva=subtotal*tax,total=subtotal+iva,advance=Number($('#advance')?.value||0);return {id:currentId||crypto.randomUUID(),type:docType,date:$('#date').value,client:{id:$('#existing').value||'',name:$('#name').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim()},items:items.map(x=>({...x})),tax,subtotal,iva,total,advance,balance:total-advance,notes:$('#notes').value.trim(),createdAt:new Date().toISOString()}}function calc(){if(!$('#totals'))return;let d=values();document.querySelectorAll('.item').forEach((el,i)=>el.querySelector('.amount').textContent=money(items[i].quantity*items[i].price));$('#totals').innerHTML=`<p>Subtotal <b>${money(d.subtotal)}</b></p><p>IVA (${d.tax*100}%) <b>${money(d.iva)}</b></p><p class="big">Total <b>${money(d.total)}</b></p>${docType==='recibo'?`<p>Anticipo <b>${money(d.advance)}</b></p><p>Saldo pendiente <b>${money(d.balance)}</b></p>`:''}`}
function validate(d){if(!d.client.name)return 'Escribe el nombre del cliente';if(!d.date)return 'Selecciona una fecha';if(!d.items.length||d.items.some(x=>!x.description.trim()||!Number.isInteger(x.quantity)||x.quantity<=0||!Number.isFinite(x.price)||x.price<0))return 'Revisa descripción, cantidad entera positiva y precio de todos los artículos';if(!Number.isFinite(d.advance)||d.advance<0)return 'El anticipo debe ser positivo';return ''}
async function saveDoc(){let d=values(),err=validate(d);if(err)return alert(err);let clients=await all('clients');let existing=clients.find(x=>x.id===d.client.id)||clients.find(x=>x.name.toLowerCase()===d.client.name.toLowerCase()&&x.phone===d.client.phone);d.client.id=existing?.id||crypto.randomUUID();await put('clients',d.client);await put('documents',d);currentId=d.id;$('#existing').value=d.client.id;$('#msg').textContent='Documento y cliente guardados correctamente.';return d}
async function exportCurrent(){let d=await saveDoc();if(d)makePdf(d)}
async function consult(){let clients=await all('clients'),docs=await all('documents');$('#screen').innerHTML=`<button class="secondary" onclick="home()">← Inicio</button><h1>Consultar</h1><label>Buscar por nombre, teléfono, correo o documento<input id="search" placeholder="Escribe para buscar"></label><div id="results"></div>`;$('#search').oninput=render;render();function render(){let q=$('#search').value.toLowerCase().trim(),c=clients.filter(x=>[x.name,x.phone,x.email].join(' ').toLowerCase().includes(q)),ds=docs.filter(x=>[x.client.name,x.client.phone,x.client.email,x.type,x.id].join(' ').toLowerCase().includes(q));$('#results').innerHTML=`<section><h2>Clientes (${c.length})</h2>${c.map(x=>`<div class="record"><b>${esc(x.name)}</b><br>${esc(x.phone)} · ${esc(x.email)}<br><button class="secondary" data-client="${x.id}">Ver documentos</button></div>`).join('')||'Sin resultados'}</section><section><h2>Documentos (${ds.length})</h2>${ds.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(x=>`<div class="record"><b>${x.type==='recibo'?'Recibo':'Cotización'} · ${esc(x.client.name)}</b><br>${esc(x.date)} · ${money(x.total)}<br><button data-pdf="${x.id}">PDF</button><button class="secondary" data-edit="${x.id}">Abrir / editar</button></div>`).join('')||'Sin resultados'}</section>`;$('#results').querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{$('#search').value=clients.find(c=>c.id===b.dataset.client).name;render()});$('#results').querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>makePdf(docs.find(d=>d.id===b.dataset.pdf)));$('#results').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let d=docs.find(x=>x.id===b.dataset.edit);newDoc(d.type,d)})}}
function backup(){$('#screen').innerHTML=`<button class="secondary" onclick="home()">← Inicio</button><h1>Respaldos</h1><section><p>Descarga una copia de clientes y documentos en formato JSON. Guárdala en Archivos o iCloud Drive.</p><button onclick="downloadBackup()">Descargar respaldo</button><label>Restaurar un respaldo<input id="restore" type="file" accept=".json,application/json"></label><button class="secondary" onclick="restoreBackup()">Restaurar archivo</button><p class="hint">Restaurar incorpora o actualiza los registros del respaldo. No borra los demás.</p></section>`}async function downloadBackup(){let obj={version:1,clients:await all('clients'),documents:await all('documents')},blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});download(blob,'Estamparte_Respaldo_'+today()+'.json')}async function restoreBackup(){try{let file=$('#restore').files[0];if(!file)return alert('Selecciona un archivo JSON');let data=JSON.parse(await file.text());if(!Array.isArray(data.clients)||!Array.isArray(data.documents))throw Error('Archivo no válido');if(!confirm(`Restaurar ${data.clients.length} clientes y ${data.documents.length} documentos?`))return;for(let c of data.clients)await put('clients',c);for(let d of data.documents)await put('documents',d);alert('Respaldo restaurado correctamente')}catch(e){alert('No se pudo restaurar: '+e.message)}}function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function makePdf(d){try{if(!window.jspdf)throw Error('La biblioteca de PDF no cargó. Comprueba tu conexión a internet.');let pdf=new jspdf.jsPDF({unit:'mm',format:'letter'}),W=215.9,y=55;pdf.setFillColor(17,17,17);pdf.rect(0,0,W,43,'F');pdf.setFillColor(255,229,0);pdf.rect(0,43,W,2,'F');let image=new Image();image.src='logo.png';await image.decode();let ratio=image.naturalWidth/image.naturalHeight,maxW=90,maxH=34,w=Math.min(maxW,maxH*ratio),h=w/ratio;pdf.addImage(image,'PNG',12+(maxW-w)/2,4+(34-h)/2,w,h);pdf.setTextColor(255,255,255);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text(['Imperio de Bizancio 1004','Juventud 2000 · Mexicali, B.C.','WhatsApp: 686 406 1365'],115,14);pdf.setTextColor(0,0,0);pdf.setFont('helvetica','bold');pdf.setFontSize(18);pdf.text(d.type==='recibo'?'COMPROBANTE DE PAGO':'COTIZACIÓN',12,y);y+=10;pdf.setFontSize(10);pdf.text('Fecha: '+d.date,12,y);y+=6;pdf.text('Cliente: '+d.client.name,12,y);y+=6;if(d.client.phone){pdf.text('Teléfono: '+d.client.phone,12,y);y+=6}if(d.client.email){pdf.text('Correo: '+d.client.email,12,y);y+=6}y+=8;function tableHead(){pdf.setFillColor(255,229,0);pdf.rect(12,y,191,9,'F');pdf.setFont('helvetica','bold');pdf.setFontSize(8);pdf.text('CANT.',14,y+6);pdf.text('DESCRIPCIÓN',33,y+6);pdf.text('P. UNIT.',165,y+6,{align:'right'});pdf.text('IMPORTE',201,y+6,{align:'right'});y+=10}tableHead();pdf.setFont('helvetica','normal');for(let it of d.items){let lines=pdf.splitTextToSize(it.description,100),height=Math.max(10,lines.length*4+5);if(y+height>235){pdf.addPage();y=18;tableHead()}pdf.text(String(it.quantity),15,y+5);pdf.text(lines,33,y+5);pdf.text(money(it.price),165,y+5,{align:'right'});pdf.text(money(it.quantity*it.price),201,y+5,{align:'right'});pdf.setDrawColor(210);pdf.line(12,y+height-1,203,y+height-1);y+=height}if(y>212){pdf.addPage();y=20}y+=9;pdf.setFontSize(10);function line(label,val,bold=false){pdf.setFont('helvetica',bold?'bold':'normal');pdf.text(label,125,y);pdf.text(money(val),202,y,{align:'right'});y+=8}line('Subtotal',d.subtotal);line('IVA ('+(d.tax*100)+'%)',d.iva);pdf.setFillColor(255,229,0);pdf.rect(120,y-6,85,10,'F');line('TOTAL',d.total,true);if(d.type==='recibo'){line('Anticipo',d.advance);line('Saldo pendiente',d.balance,true)}if(d.notes){y+=8;if(y>245){pdf.addPage();y=20}pdf.setFont('helvetica','bold');pdf.text('Observaciones:',12,y);y+=6;pdf.setFont('helvetica','normal');pdf.text(pdf.splitTextToSize(d.notes,185),12,y)}pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text('¡Gracias por su confianza!',107,270,{align:'center'});let blob=pdf.output('blob');download(blob,`Estamparte_${d.type}_${d.date}_${d.client.name.replace(/[^a-zA-Z0-9]/g,'_')}.pdf`)}catch(e){alert('No se pudo generar el PDF: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
